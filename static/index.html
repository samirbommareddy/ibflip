<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IB-Flip</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>IB-Flip</h1>
          <p id="status">No game started</p>
        </div>
        <div class="top-controls">
          <label for="playerCount">Players</label>
          <select id="playerCount" aria-label="Total players">
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4" selected>4</option>
            <option value="5">5</option>
          </select>
          <span id="turnBadge" class="turn-badge">Not Started</span>
          <button id="startButton" type="button">New Game</button>
        </div>
      </header>

      <section class="table">
        <section class="opponents" id="opponents"></section>

        <section class="center">
          <div class="pile live-zone">
            <h2>Live Pile</h2>
            <div id="liveTop" class="large-card muted">Empty</div>
            <p id="liveMeta"></p>
          </div>
          <div class="move-strip" id="moveBanner">Start a new game</div>
          <div class="pile discard-zone">
            <h2>Discard</h2>
            <div id="discardTop" class="large-card muted">Empty</div>
            <p id="discardMeta"></p>
          </div>
          <div class="log">
            <h2>Recent Moves</h2>
            <ol id="gameLog"></ol>
          </div>
        </section>

        <section class="human" data-player-index="0">
          <div class="zone">
            <h2>Human Hand</h2>
            <div id="hand" class="cards"></div>
          </div>
          <div class="zone">
            <h2>Face-Up Cards</h2>
            <div id="faceUp" class="slots"></div>
          </div>
          <div class="zone">
            <h2>Face-Down Cards</h2>
            <div id="faceDown" class="cards"></div>
          </div>
          <div class="zone">
            <h2>Other Actions</h2>
            <div id="specialActions" class="cards"></div>
          </div>
        </section>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
