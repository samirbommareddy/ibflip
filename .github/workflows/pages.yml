name: Deploy frontend to Cloudflare Pages

# main -> production (ibflip.pages.dev / ibflip.com); other branches -> <branch>.ibflip.pages.dev previews.
on:
  workflow_dispatch:
  push:
    paths: ["static/**", ".github/workflows/pages.yml"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy static --project-name ibflip --branch ${{ github.ref_name }}
